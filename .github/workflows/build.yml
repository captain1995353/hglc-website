name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* values are compiled into the client bundle, so they must
      # be present at build time rather than at container start.
      #
      # The Supabase URL and publishable key are public by design — they ship
      # inside every page the browser downloads, and row-level security is what
      # protects the data, not their secrecy. So they live here in plain sight.
      # The secret key is NOT here: it is injected as runtime env on the server
      # only (see docker-compose.yml).
      #
      # Payment account numbers and phone numbers are managed in the admin
      # dashboard now, so they are no longer baked into the image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://hangeulglobal.com
            NEXT_PUBLIC_SUPABASE_URL=https://aabqtyhspcpktnxzropd.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_RzWbhe3ECLTGxnbyxJxxvA_cJp_Kqzd
            NEXT_PUBLIC_CONTACT_EMAIL=info@hangeulglobal.com
