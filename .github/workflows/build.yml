name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* values are compiled into the client bundle, so they have
      # to be present here rather than at container start. Add them as repo
      # secrets (Settings -> Secrets and variables -> Actions) and re-run this
      # workflow whenever they change.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://hangeulglobal.com
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_BKASH_NUMBER=${{ secrets.NEXT_PUBLIC_BKASH_NUMBER }}
            NEXT_PUBLIC_NAGAD_NUMBER=${{ secrets.NEXT_PUBLIC_NAGAD_NUMBER }}
            NEXT_PUBLIC_BANK_DETAILS=${{ secrets.NEXT_PUBLIC_BANK_DETAILS }}
            NEXT_PUBLIC_CONTACT_PHONE=${{ secrets.NEXT_PUBLIC_CONTACT_PHONE }}
            NEXT_PUBLIC_CONTACT_EMAIL=info@hangeulglobal.com
